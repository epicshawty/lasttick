<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="LastTick">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191c21"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="55%" stop-color="#9df5c4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3ddc84" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#plate)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <text x="640" y="152" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="112" font-weight="800" letter-spacing="14" fill="url(#mark)">LASTTICK</text>

  <rect x="440" y="180" width="400" height="2" fill="url(#rule)"/>

  <text x="640" y="222" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" letter-spacing="7" fill="#8f97a3">ONE TICK EARLIER IS TOO LATE</text>

  <!-- the ledge the mod is about: floor, a gap, floor again, and the cube on the lip -->
  <rect x="0" y="296" width="622" height="24" fill="#2b313a"/>
  <rect x="0" y="296" width="622" height="4" fill="#474f5c"/>
  <rect x="654" y="306" width="626" height="14" fill="#20242b"/>
  <rect x="654" y="306" width="626" height="3" fill="#343b45"/>
  <rect x="594" y="276" width="22" height="22" rx="3" fill="#3ddc84"/>
</svg>
